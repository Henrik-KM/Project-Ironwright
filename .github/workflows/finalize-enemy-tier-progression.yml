name: Finalize enemy tier progression

on:
  push:
    branches:
      - agent/enemy-tier-ecology-progression
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out enemy-tier branch
        uses: actions/checkout@v4
        with:
          ref: agent/enemy-tier-ecology-progression
          fetch-depth: 0

      - name: Apply deterministic runtime hardening
        run: python3 scripts/finalize_enemy_tier_progression.py

      - name: Commit finalized runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/finalize-enemy-tier-progression.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Enemy-tier runtime is already finalized."
          else
            git commit -m "Finalize population-driven enemy progression runtime"
            git push origin HEAD:agent/enemy-tier-ecology-progression
          fi
