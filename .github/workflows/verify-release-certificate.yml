name: Verify release certificate

on:
  push:
    branches:
      - agent/commercial-release-candidate
      - agent/commercial-release-candidate-recertification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete certification history
        uses: actions/checkout@v4
        with:
          # The bootstrap provenance path compares the certificate's source
          # parent with its own parent. Keep the complete history so that
          # verification works for both ordinary and bootstrap certificates.
          fetch-depth: 0

      - name: Verify certified source, outputs and package records
        run: python3 scripts/verify_release_certificate.py
