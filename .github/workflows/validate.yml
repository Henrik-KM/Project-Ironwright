name: Validate repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-browser-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate browser reference, tier ecology and product contracts
        run: npm run validate

      - name: Validate inherited aesthetic integration
        run: python scripts/validate_tiered_aesthetic.py

  validate-native-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Report Godot version
        run: godot --version

      - name: Import and parse native project
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --editor --quit

      - name: Run core native gameplay tests
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/test_runner.gd

      - name: Run native aesthetic acceptance tests
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/aesthetic_test_runner.gd

      - name: Run full-game progression and outpost tests
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/full_game_test_runner.gd

      - name: Run first-session UX and guidance tests
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/first_session_ux_test_runner.gd

      - name: Run resolution and large-text accessibility tests
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/resolution_accessibility_test_runner.gd

      - name: Run complete start-to-victory systemic test
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/complete_game_test_runner.gd

      - name: Run presentation reset and salvage escort tests
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/presentation_and_salvage_escort_test_runner.gd

      - name: Run distributed autonomy, ecology and vertical-slice tests
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/intelligence_and_vertical_slice_test_runner.gd

      - name: Run operation detail transition tests
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/operation_detail_test_runner.gd

      - name: Run population-driven enemy tier tests
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/enemy_tier_progression_test_runner.gd

      - name: Run commercial release tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          output="$(godot --headless --audio-driver Dummy --quiet-audio --path game --verbose --script res://tests/release_test_runner.gd 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "Commercial release tests exited with status $status."
            exit "$status"
          fi
          if printf '%s\n' "$output" | grep -Eq 'Leaked instance:|ObjectDB instances were leaked|Resource still in use:|resources still in use at exit|Cannot get path of node'; then
            echo "Release validation emitted a teardown leak or orphan-node diagnostic."
            exit 1
          fi

      - name: Run large-population performance tests
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/performance_stress_test_runner.gd

      - name: Run twenty-hour-equivalent long-run soak
        run: godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/long_run_soak_test_runner.gd

      - name: Capture release population benchmark
        shell: bash
        run: |
          set -o pipefail
          output="$(godot --headless --audio-driver Dummy --quiet-audio --path game --script res://tests/performance_benchmark_runner.gd 2>&1)"
          printf '%s\n' "$output"
          if ! printf '%s\n' "$output" | grep -q 'PERFORMANCE_BENCHMARK_JSON'; then
            echo "The release population benchmark did not emit its machine-readable report."
            exit 1
          fi
