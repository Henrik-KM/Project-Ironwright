name: Validate repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-browser-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate browser reference, tier ecology and product contracts
        run: npm run validate

      - name: Validate inherited aesthetic integration
        run: python3 scripts/validate_tiered_aesthetic.py

  validate-native-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Report Godot version
        run: godot --version

      - name: Check tier scripts directly
        run: |
          godot --headless --path game --check-only --script res://scripts/world/organic_nest_3d.gd
          godot --headless --path game --check-only --script res://scripts/enemies/organic_enemy_tiered_3d.gd
          godot --headless --path game --check-only --script res://scripts/systems/enemy_tier_director_3d.gd
          godot --headless --path game --check-only --script res://scripts/main_world_tiered_3d.gd

      - name: Import and parse native project
        run: godot --headless --path game --editor --quit

      - name: Run core native gameplay tests
        run: godot --headless --path game --script res://tests/test_runner.gd

      - name: Run native aesthetic acceptance tests
        run: godot --headless --path game --script res://tests/aesthetic_test_runner.gd

      - name: Run full-game progression and outpost tests
        run: godot --headless --path game --script res://tests/full_game_test_runner.gd

      - name: Run first-session UX and guidance tests
        run: godot --headless --path game --script res://tests/first_session_ux_test_runner.gd

      - name: Run complete start-to-victory systemic test
        run: godot --headless --path game --script res://tests/complete_game_test_runner.gd

      - name: Run presentation reset and salvage escort tests
        run: godot --headless --path game --script res://tests/presentation_and_salvage_escort_test_runner.gd

      - name: Run distributed autonomy, ecology and vertical-slice tests
        run: godot --headless --path game --script res://tests/intelligence_and_vertical_slice_test_runner.gd

      - name: Run operation detail transition tests
        run: godot --headless --path game --script res://tests/operation_detail_test_runner.gd

      - name: Run commercial release tests
        run: godot --headless --path game --script res://tests/release_test_runner.gd

      - name: Run population-driven enemy tier tests
        run: godot --headless --path game --script res://tests/enemy_tier_progression_test_runner.gd
