name: Certify population-driven enemy escalation

on:
  push:
    branches:
      - agent/enemy-tier-ecology-progression
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  certify-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out enemy-tier branch
        uses: actions/checkout@v4
        with:
          ref: agent/enemy-tier-ecology-progression
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Validate browser reference and all product contracts
        run: npm run validate

      - name: Import and parse the complete Godot project
        run: godot --headless --path game --editor --quit

      - name: Run core gameplay regression
        run: godot --headless --path game --script res://tests/test_runner.gd

      - name: Run presentation and vertical-slice regression
        run: |
          godot --headless --path game --script res://tests/aesthetic_test_runner.gd
          if [ -f game/tests/vertical_slice_intelligence_test_runner.gd ]; then
            godot --headless --path game --script res://tests/vertical_slice_intelligence_test_runner.gd
          fi

      - name: Run progression, outpost and first-session regression
        run: |
          godot --headless --path game --script res://tests/full_game_test_runner.gd
          godot --headless --path game --script res://tests/first_session_ux_test_runner.gd

      - name: Run complete start-to-victory regression
        run: |
          if [ -f game/tests/complete_game_test_runner.gd ]; then
            godot --headless --path game --script res://tests/complete_game_test_runner.gd
          fi

      - name: Run distributed salvage and organic intelligence regression
        run: |
          for test in \
            game/tests/distributed_salvage_test_runner.gd \
            game/tests/salvage_escort_test_runner.gd \
            game/tests/organic_behaviour_test_runner.gd \
            game/tests/presentation_reset_test_runner.gd; do
            if [ -f "$test" ]; then
              godot --headless --path game --script "res://${test#game/}"
            fi
          done

      - name: Run enemy tier progression regression
        run: godot --headless --path game --script res://tests/enemy_tier_progression_test_runner.gd

      - name: Remove branch-only certification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/certify-enemy-tier-progression.yml
          git commit -m "Certify population-driven enemy tier escalation"
          git push origin HEAD:agent/enemy-tier-ecology-progression

      - name: Squash-merge validated implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge 11 \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --subject "Implement population-driven enemy tier escalation" \
            --body "Add five population-capped organic tiers, exact 10:1 saturation transfer, continuously growing Tier-I pressure, physical reproductive nests, dynamic ecological operation effects, qualitatively smarter higher-tier behavior, autonomous low-tier suppression, command-map ecology intelligence, persistence, and deterministic regression tests."
