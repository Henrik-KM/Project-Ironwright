name: Apply one-off tier serialization fix

on:
  push:
    branches:
      - agent/enemy-tier-ecological-escalation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/enemy-tier-ecological-escalation
          fetch-depth: 0

      - name: Replace the invalid integer String constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('game/scripts/systems/enemy_tier_director_3d.gd')
          text = path.read_text(encoding='utf-8')
          old = 'serialized_states[String(tier)] = tier_state(tier)'
          new = 'serialized_states[str(tier)] = tier_state(tier)'
          if old not in text:
              raise SystemExit('Expected serialization expression was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit the corrected director
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- game/scripts/systems/enemy_tier_director_3d.gd
          git commit -m "Fix enemy tier state serialization key"
          git push origin HEAD:agent/enemy-tier-ecological-escalation
