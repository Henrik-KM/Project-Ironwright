name: Finalize release branch cleanup

on:
  push:
    branches:
      - agent/commercial-release-candidate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/commercial-release-candidate
          fetch-depth: 0

      - name: Remove temporary scaffolding and commit the cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/generate-release-assets.yml \
            game/assets/release_asset_pack/manifest.json \
            .github/workflows/cleanup-release-branch.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No temporary release scaffolding remained."
          else
            git commit -m "Remove temporary release asset scaffolding"
            git push origin HEAD:agent/commercial-release-candidate
          fi
