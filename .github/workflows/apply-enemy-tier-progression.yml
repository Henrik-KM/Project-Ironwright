name: Apply enemy tier progression integration

on:
  push:
    branches:
      - agent/enemy-tier-ecology-progression
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out enemy-tier branch
        uses: actions/checkout@v4
        with:
          ref: agent/enemy-tier-ecology-progression
          fetch-depth: 0

      - name: Integrate stable runtime surfaces
        run: python3 scripts/integrate_enemy_tier_progression.py

      - name: Commit integrated scene, contracts and CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-enemy-tier-progression.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Enemy-tier integration is already current."
          else
            git commit -m "Integrate population-driven enemy tier escalation"
            git push origin HEAD:agent/enemy-tier-ecology-progression
          fi
