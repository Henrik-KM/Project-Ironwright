name: Merge certified commercial release candidate

on:
  push:
    branches:
      - agent/commercial-release-candidate

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-certified-pr:
    if: github.actor == 'github-actions[bot]' && github.event.head_commit.message == 'Certify Project Ironwright 1.0.0-rc.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out certification commit and tested parent
        uses: actions/checkout@v4
        with:
          # The merge gate verifies the same bootstrap provenance as the
          # standalone certificate workflow, so it needs the complete history.
          fetch-depth: 0

      - name: Verify exact certificate provenance
        run: python3 scripts/verify_release_certificate.py

      - name: Confirm pull request remains open and ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head agent/commercial-release-candidate --base main --state open --json number --jq '.[0].number')"
          test -n "$PR_NUMBER"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "OPEN"
          if [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Merge certified release candidate into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head agent/commercial-release-candidate --base main --state open --json number --jq '.[0].number')"
          test -n "$PR_NUMBER"
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --delete-branch \
            --subject "Release Project Ironwright 1.0.0-rc.1" \
            --body "Merge the certificate-gated commercial release candidate: original production assets, secondary animation, adaptive audio and music, expanded content, large-world performance architecture, transactional save migration, controller/accessibility/localization, long-run balance profiles, Windows/Linux packaging, complete start-to-victory validation, and an exact machine-readable release certificate."
