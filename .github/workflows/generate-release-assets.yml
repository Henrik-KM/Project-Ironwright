name: Generate original release assets

on:
  push:
    branches:
      - agent/commercial-release-candidate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/commercial-release-candidate
          fetch-depth: 0

      - name: Generate deterministic textures, ambience, music and effects
        run: python3 scripts/generate_release_assets.py

      - name: Commit generated release binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/release/textures game/assets/release/audio
          if git diff --cached --quiet; then
            echo "Release assets are already current."
          else
            git commit -m "Generate original commercial release asset library"
            git push origin HEAD:agent/commercial-release-candidate
          fi
