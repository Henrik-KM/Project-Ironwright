name: Bug report
description: Report reproducible incorrect behaviour
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start...
        2. Do...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or build
  - type: textarea
    id: logs
    attributes:
      label: Logs, save, or screenshots
